<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>からだのツボケア</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>
    <h1>からだのツボケア</h1>

    <p>
      気になる症状を選んでください
    </p>

    <div class="symptom-list">

      <button>😣 頭痛</button>

      <button>💻 肩こり</button>

      <button>🧍 腰痛</button>

      <button>👁️ 目の疲れ</button>

      <button>🍵 胃の不快感</button>

      <button>🌙 寝つきが悪い</button>
      
      </div>

    <section id="tsubo-card" class="tsubo-card hidden">
  <h2 id="tsubo-name">おすすめのツボ</h2>

  <img id="tsubo-image" class="tsubo-image" src="" alt="ツボの位置">
  <p id="tsubo-place"></p>

  <p id="tsubo-how"></p>
</section>
    
    <p class="notice">
      ※このアプリはセルフケアの参考情報を提供するものです。
      強い痛みや長引く症状がある場合は、医療機関への相談を検討してください。
    </p>

  </main>

  <script src="script.js"></script>

</body>
</html>
